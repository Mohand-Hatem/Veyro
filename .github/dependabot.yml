# Weekly update pull requests. Each one runs the CI workflow, so an update only merges when every gate stays green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # The project runs on Node 22 (long-term support). Odd-numbered majors are never long-term support, and a jump to the next LTS is a deliberate decision.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
